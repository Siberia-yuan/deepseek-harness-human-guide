<rect x="80" y="240" width="400" height="260" rx="4" fill="url(#g8)" stroke="#6c8ebf" stroke-width="1.5"/><rect x="80" y="240" width="400" height="30" rx="4" fill="#6c8ebf" stroke="#6c8ebf" stroke-width="1.5"/><text x="280" y="259.55" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff"><tspan x="280" dy="0">Plugin A's ctx (extend child context)</tspan></text>
<text x="280" y="336.09999999999997" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="280" dy="0">inherits the root</tspan><tspan x="280" dy="16.200000000000003">sees the global services</tspan></text>
<rect x="523" y="244" width="400" height="260" rx="4" fill="#0000002e"/>
