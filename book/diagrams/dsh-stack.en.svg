<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1008 688" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<rect x="-24" y="-24" width="1008" height="688" fill="#ffffff"/>
<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#bec3ca"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e8d4"/><stop offset="1" stop-color="#b3c3b2"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dae8fc"/><stop offset="1" stop-color="#b7c3d4"/></linearGradient><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#b8c5d5"/></linearGradient><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#d6c1ab"/></linearGradient></defs>
<rect x="0" y="0" width="0" height="0" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<rect x="0" y="0" width="0" height="0" rx="0" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="490" y="45.6" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#333333"><tspan x="490" dy="0">The dsh plugin tree, five layers</tspan></text>
<rect x="43" y="94" width="430" height="80" rx="10" fill="#0000002e"/>
<rect x="40" y="90" width="430" height="80" rx="10" fill="url(#g3)" stroke="#64748b" stroke-width="1.5"/><text x="255" y="125.77499999999999" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="255" dy="0">profile selection (bottom)</tspan><tspan x="255" dy="17.55">web has a UI, headless runs once</tspan></text>
<rect x="43" y="194" width="430" height="80" rx="10" fill="#0000002e"/>
<rect x="40" y="190" width="430" height="80" rx="10" fill="url(#g4)" stroke="#82b366" stroke-width="1.5"/><text x="255" y="225.775" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="255" dy="0">bundles</tspan><tspan x="255" dy="17.55">dsh-base first, dsh-web-app adds the UI</tspan></text>
<rect x="43" y="294" width="430" height="80" rx="10" fill="#0000002e"/>
<rect x="40" y="290" width="430" height="80" rx="10" fill="url(#g5)" stroke="#6c8ebf" stroke-width="1.5"/><text x="255" y="325.77500000000003" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="255" dy="0">profile's own patch</tspan><tspan x="255" dy="17.55">for example, the web template's tweaks</tspan></text>
<rect x="43" y="394" width="430" height="80" rx="10" fill="#0000002e"/>
<rect x="40" y="390" width="430" height="80" rx="10" fill="url(#g6)" stroke="#5b7db1" stroke-width="1.5"/><text x="255" y="425.77500000000003" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="255" dy="0">user-level cordis.patch.yml</tspan><tspan x="255" dy="17.55">stored in Harness home</tspan></text>
<rect x="43" y="494" width="430" height="80" rx="10" fill="#0000002e"/>
<rect x="40" y="490" width="430" height="80" rx="10" fill="url(#g7)" stroke="#d79b00" stroke-width="1.5"/><text x="255" y="525.775" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="255" dy="0">your --patch overlay (top)</tspan><tspan x="255" dy="17.55">cordis.yml, insert a plugin or change a config</tspan></text>
<text x="528" y="126.10000000000001" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="528" dy="0">which finished package you want</tspan><tspan x="528" dy="16.200000000000003">web and headless are the two shipped templates</tspan></text>
<text x="528" y="226.1" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="528" dy="0">a packaging format for a set of plugins</tspan><tspan x="528" dy="16.200000000000003">still modifiable by layers above</tspan></text>
<text x="528" y="326.09999999999997" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="528" dy="0">the profile layer's tweaks</tspan><tspan x="528" dy="16.200000000000003">for example, the web template's own</tspan></text>
<text x="528" y="426.09999999999997" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="528" dy="0">your machine-wide tweaks</tspan><tspan x="528" dy="16.200000000000003">every profile stacks this layer</tspan></text>
<text x="528" y="526.1" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="528" dy="0">the layer you touch most in development</tspan><tspan x="528" dy="16.200000000000003">highest priority, visible in dsh --profile web --dump-config</tspan></text>
<text x="48" y="624.2" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="48" dy="0">Assembled bottom-up, overridden top-down. Every layer may override the layer below.</tspan></text>
</svg>
