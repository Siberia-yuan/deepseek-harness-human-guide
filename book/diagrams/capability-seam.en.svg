<text x="500" y="45.6" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#333333"><tspan x="500" dy="0">A capability seam, three roles</tspan></text>
<text x="88" y="119.55" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#475569"><tspan x="88" dy="0">One capability (seam)</tspan></text>
