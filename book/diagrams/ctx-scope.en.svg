<text x="490" y="45.6" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#333333"><tspan x="490" dy="0">How contexts are scoped</tspan></text>
<text x="68" y="119.55" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#475569"><tspan x="68" dy="0">Root Context</tspan></text>
