<text x="48" y="434.2" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="48" dy="0">Want a different part, pull one out and plug a new one in, the rest stay put. All of these are swapped from configuration, no framework changes.</tspan></text>
