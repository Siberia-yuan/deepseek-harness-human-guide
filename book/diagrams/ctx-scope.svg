<text x="48" y="584.2" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="48" dy="0">每个插件拿到自己的 ctx，继承父上下文。isolate 能划出一块只有自己可见的服务作用域，比如只给某个 agent 用的私有实现。</tspan></text>
