<rect x="90" y="180" width="240" height="100" rx="10" fill="url(#g4)" stroke="#6c8ebf" stroke-width="1.5"/><text x="210" y="225.775" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="210" dy="0">Service Definition</tspan><tspan x="210" dy="17.55">the interface, what the capability looks like</tspan></text>
