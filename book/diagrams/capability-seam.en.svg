<rect x="370" y="180" width="240" height="100" rx="10" fill="url(#g5)" stroke="#82b366" stroke-width="1.5"/><text x="490" y="225.775" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="490" dy="0">Service Provider</tspan><tspan x="490" dy="17.55">the implementation, replaceable</tspan></text>
<rect x="653" y="184" width="240" height="100" rx="10" fill="#0000002e"/>
<rect x="650" y="180" width="240" height="100" rx="10" fill="url(#g6)" stroke="#d79b00" stroke-width="1.5"/><text x="770" y="225.775" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="770" dy="0">Consumer</tspan><tspan x="770" dy="17.55">the user of it, usually a model-facing tool</tspan></text>
<rect x="370" y="330" width="240" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="490" y="359.2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="normal" fill="#333333"><tspan x="490" dy="0">new Provider (e.g. a remote sandbox)</tspan></text>
<text x="68" y="434.2" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="68" dy="0">Missing any one role, the capability is incomplete. Swap the Provider and you swap the whole capability; a remote sandbox moves Bash, PTY and LSP along with it.</tspan></text>
