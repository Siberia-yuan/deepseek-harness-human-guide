<rect x="553" y="334" width="340" height="100" rx="10" fill="#0000002e"/>
<rect x="550" y="330" width="340" height="100" rx="10" fill="url(#g10)" stroke="#9673a6" stroke-width="1.5"/><text x="720" y="375.77500000000003" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="normal" fill="#333333"><tspan x="720" dy="0">a private service via isolate</tspan><tspan x="720" dy="17.55">only B sees it, A does not</tspan></text>
<text x="48" y="584.2" text-anchor="start" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="48" dy="0">Every plugin gets its own ctx inheriting the parent. isolate carves out a service scope only the caller can see, e.g. a private implementation for one agent.</tspan></text>
